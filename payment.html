
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>お支払い方法 | 中国語レッスン（日本語話者向け）</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            background: #f7f7f7;
            color: #222;
        }
        header {
            background: #1e88e5;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 900px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
        }
        h2 {
            border-bottom: 2px solid #1e88e5;
            padding-bottom: 10px;
        }
        .price {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .payment-block {
            margin-bottom: 40px;
        }
        .qr-group {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
        }
        .qr-item {
            text-align: center;
        }
        .qr-item img {
            width: 220px;
            height: auto;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        .label {
            margin-top: 10px;
            font-weight: bold;
        }
        .note {
            margin-top: 15px;
            font-size: 14px;
            color: #555;
        }
        a.paylink {
            display: inline-block;
            margin-top: 10px;
            text-decoration: none;
            color: #1e88e5;
            font-weight: bold;
        }
    </style>

<body>

<header>
    <h1>お支払い方法</h1>
    <p>中国語レッスン（日本語話者向け）</p>

<div class="container">

    <div class="payment-block">

            </div>

            <div class="qr-item">
                <img src="Alipay 10 SGD QR Code.jpeg" alt="Alipay QR 10 SGD">

            </div>
        </div>

        <div class="note">
            ※ お支払い後、必ずレッスン予約を行ってください。未払いの場合、レッスンは確定されません。

    </div>

        <div class="qr-group">
            <div class="qr-item">
                <img src="Wise Jap 45 SGD QR code.jpg" alt="Wise QR 45 SGD">

                <a class="paylink" href="https://wise.com/pay/r/wDtT07GYOJO9BJs" target="_blank">Wiseで支払う</a>

            <div class="qr-item">
                <img src="Paypal 45 SGD QR Code.png" alt="PayPal QR 45 SGD">
                <div class="label">PayPal</div>
                <a class="paylink" href="https://www.paypal.com/ncp/payment/GC5V2KZZJF6Y6" target="_blank">PayPalで支払う</a>
            </div>

            <div class="qr-item">
                <img src="Alipay 45 SGD QR Code.jpeg" alt="Alipay QR 45 SGD">
                <div class="label">Alipay</div>
            </div>
        </div>

        <div class="note">
            ※ レッスンは事前支払い制です。お支払い確認後に正式に確定されます。
